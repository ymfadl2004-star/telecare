name: Build TeleCare APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          flutter create telecare_app
          python3 -c "import shutil; shutil.copyfile('main.dart', 'telecare_app/lib/main.dart')"
          cd telecare_app
          rm -rf test
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telecare-app-release
          path: telecare_app/build/app/outputs/flutter-apk/app-release.apk
